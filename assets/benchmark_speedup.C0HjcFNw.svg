<svg xmlns="http://www.w3.org/2000/svg" width="960" height="990" viewBox="0 0 960 990" role="img" aria-labelledby="title desc">
  <title id="title">MuJoCo time / RaiSim time</title>
  <desc id="desc">Vertical bars for 10 valid comparisons, using unrounded medians of three single-threaded runs. Values above one mean RaiSim is faster. The vertical ratio axis is logarithmic.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #24313d; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #596674; }
    .label { font-size: 16px; font-weight: 600; }
    .value { font-size: 22px; font-weight: 700; }
    .tick { font-size: 16px; fill: #596674; }
    .axis { stroke: #a8b4bf; stroke-width: 1; }
    .grid { stroke: #e1e4e5; stroke-width: 1; }
    .ratio { fill: #2f6fb7; }</style>
  <rect width="960" height="990" fill="#fff"/>
  <text x="96" y="46" class="title">MuJoCo time / RaiSim time</text>
  <text x="96" y="80" class="subtitle">Median of three runs · AMD Ryzen 9 3950X · higher ratios mean RaiSim is faster</text>
  <line x1="96" y1="710.0" x2="936" y2="710.0" class="grid"/>
  <text x="80" y="716.0" text-anchor="end" class="tick">1×</text>
  <line x1="96" y1="638.8" x2="936" y2="638.8" class="grid"/>
  <text x="80" y="644.8" text-anchor="end" class="tick">2×</text>
  <line x1="96" y1="567.5" x2="936" y2="567.5" class="grid"/>
  <text x="80" y="573.5" text-anchor="end" class="tick">4×</text>
  <line x1="96" y1="496.2" x2="936" y2="496.2" class="grid"/>
  <text x="80" y="502.2" text-anchor="end" class="tick">8×</text>
  <line x1="96" y1="425.0" x2="936" y2="425.0" class="grid"/>
  <text x="80" y="431.0" text-anchor="end" class="tick">16×</text>
  <line x1="96" y1="353.8" x2="936" y2="353.8" class="grid"/>
  <text x="80" y="359.8" text-anchor="end" class="tick">32×</text>
  <line x1="96" y1="282.5" x2="936" y2="282.5" class="grid"/>
  <text x="80" y="288.5" text-anchor="end" class="tick">64×</text>
  <line x1="96" y1="211.2" x2="936" y2="211.2" class="grid"/>
  <text x="80" y="217.2" text-anchor="end" class="tick">128×</text>
  <line x1="96" y1="140.0" x2="936" y2="140.0" class="grid"/>
  <text x="80" y="146.0" text-anchor="end" class="tick">256×</text>
  <line x1="96" y1="140" x2="96" y2="710" class="axis"/>
  <line x1="96" y1="710" x2="936" y2="710" class="axis"/>
  <line x1="96" y1="710.0" x2="936" y2="710.0" stroke="#596674" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="25" y="425" transform="rotate(-90 25 425)" text-anchor="middle" class="subtitle">Time ratio (logarithmic scale)</text>
  <rect x="114.5" y="573.3" width="47.0" height="136.7" rx="4" class="ratio"/>
  <text x="138.0" y="559.3" text-anchor="middle" class="value">3.78×</text>
  <text x="138.0" y="740" transform="rotate(-45 138.0 740)" text-anchor="end" class="label">Chain, 10 links</text>
  <rect x="198.5" y="510.6" width="47.0" height="199.4" rx="4" class="ratio"/>
  <text x="222.0" y="496.6" text-anchor="middle" class="value">6.96×</text>
  <text x="222.0" y="740" transform="rotate(-45 222.0 740)" text-anchor="end" class="label">Chain, 20 links</text>
  <rect x="282.5" y="613.3" width="47.0" height="96.7" rx="4" class="ratio"/>
  <text x="306.0" y="599.3" text-anchor="middle" class="value">2.56×</text>
  <text x="306.0" y="740" transform="rotate(-45 306.0 740)" text-anchor="end" class="label">ANYmal standing</text>
  <rect x="366.5" y="611.6" width="47.0" height="98.4" rx="4" class="ratio"/>
  <text x="390.0" y="597.6" text-anchor="middle" class="value">2.61×</text>
  <text x="390.0" y="740" transform="rotate(-45 390.0 740)" text-anchor="end" class="label">ANYmal falling</text>
  <rect x="450.5" y="548.6" width="47.0" height="161.4" rx="4" class="ratio"/>
  <text x="474.0" y="534.6" text-anchor="middle" class="value">4.81×</text>
  <text x="474.0" y="740" transform="rotate(-45 474.0 740)" text-anchor="end" class="label">ANYmal on heightmap</text>
  <rect x="534.5" y="621.8" width="47.0" height="88.2" rx="4" class="ratio"/>
  <text x="558.0" y="607.8" text-anchor="middle" class="value">2.36×</text>
  <text x="558.0" y="740" transform="rotate(-45 558.0 740)" text-anchor="end" class="label">Primitive speed</text>
  <rect x="618.5" y="606.3" width="47.0" height="103.7" rx="4" class="ratio"/>
  <text x="642.0" y="592.3" text-anchor="middle" class="value">2.74×</text>
  <text x="642.0" y="740" transform="rotate(-45 642.0 740)" text-anchor="end" class="label">Strandbeest</text>
  <rect x="702.5" y="376.2" width="47.0" height="333.8" rx="4" class="ratio"/>
  <text x="726.0" y="362.2" text-anchor="middle" class="value">25.71×</text>
  <text x="726.0" y="740" transform="rotate(-45 726.0 740)" text-anchor="end" class="label">Heightmap LiDAR</text>
  <rect x="786.5" y="196.9" width="47.0" height="513.1" rx="4" class="ratio"/>
  <text x="810.0" y="182.9" text-anchor="middle" class="value">147.16×</text>
  <text x="810.0" y="740" transform="rotate(-45 810.0 740)" text-anchor="end" class="label">Primitive ray scaling</text>
  <rect x="870.5" y="455.3" width="47.0" height="254.7" rx="4" class="ratio"/>
  <text x="894.0" y="441.3" text-anchor="middle" class="value">11.92×</text>
  <text x="894.0" y="740" transform="rotate(-45 894.0 740)" text-anchor="end" class="label">Deformable cloth</text>
  <text x="516" y="880" text-anchor="middle" class="subtitle">Workload</text>
  <text x="516" y="938" text-anchor="middle" class="tick">Based on unrounded median wall-clock durations, including scene construction.</text>
  <text x="516" y="966" text-anchor="middle" class="tick">1× = equal runtime</text>
</svg>

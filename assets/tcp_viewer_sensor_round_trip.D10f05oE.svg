<svg xmlns="http://www.w3.org/2000/svg" width="1017.44" height="320" viewBox="0 0 1017.44 320" role="img" aria-labelledby="t d">
<title id="t">TCP viewer RGB and depth sensor round trip</title>
<desc id="d">A manual camera request leaves RaiSim, renders in rayrai, and validated pixels return to the sensor buffer.</desc>
<defs><marker id="aAccent" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2980b9"/></marker><marker id="aGreen" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1abc9c"/></marker><marker id="aMuted" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#666666"/></marker><marker id="aWarn" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#d9822b"/></marker></defs>
<rect width="1017.44" height="320" fill="#fcfcfc"/>
<rect x="18" y="20" width="201.859" height="62" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M19 21.5 H218.859" stroke="#2980b9" stroke-width="3" stroke-linecap="round"/>
<text x="118.93" y="46" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">1 · Sensor due</text>
<text x="118.93" y="66" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">MANUAL, update period elapsed</text>
<rect x="277.859" y="20" width="201.859" height="62" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M278.859 21.5 H478.719" stroke="#2980b9" stroke-width="3" stroke-linecap="round"/>
<text x="378.789" y="46" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">2 · Request</text>
<text x="378.789" y="66" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">pose · lens · resolution · clip</text>
<rect x="537.719" y="20" width="201.859" height="62" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M538.719 21.5 H738.578" stroke="#2980b9" stroke-width="3" stroke-linecap="round"/>
<text x="638.648" y="46" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">3 · rayrai render</text>
<text x="638.648" y="66" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">complete RGB or depth pass</text>
<rect x="797.578" y="20" width="201.859" height="62" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M798.578 21.5 H998.438" stroke="#2980b9" stroke-width="3" stroke-linecap="round"/>
<text x="898.508" y="46" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">4 · Preview</text>
<text x="898.508" y="66" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">texture · timing · depth range</text>
<path d="M224.859 51 L272.859 51" fill="none" stroke="#2980b9" stroke-width="1.6" marker-end="url(#aAccent)"/>
<path d="M484.719 51 L532.719 51" fill="none" stroke="#2980b9" stroke-width="1.6" marker-end="url(#aAccent)"/>
<path d="M744.578 51 L792.578 51" fill="none" stroke="#2980b9" stroke-width="1.6" marker-end="url(#aAccent)"/>
<rect x="537.719" y="150" width="201.859" height="78" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M538.719 151.5 H738.578" stroke="#1abc9c" stroke-width="3" stroke-linecap="round"/>
<text x="638.648" y="176" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">5 · Return frame</text>
<text x="638.648" y="196" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">BGRA bytes or float depth</text>
<text x="638.648" y="214" font-family="SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="11" fill="#666666" text-anchor="middle">REQUEST_SENSOR_UPDATE</text>
<rect x="277.859" y="150" width="201.859" height="78" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M278.859 151.5 H478.719" stroke="#1abc9c" stroke-width="3" stroke-linecap="round"/>
<text x="378.789" y="176" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">6 · Validate all</text>
<text x="378.789" y="196" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">tag · name · type · dimensions</text>
<text x="378.789" y="214" font-family="SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="11" fill="#666666" text-anchor="middle">no partial writes</text>
<rect x="18" y="150" width="201.859" height="78" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/>
<path d="M19 151.5 H218.859" stroke="#1abc9c" stroke-width="3" stroke-linecap="round"/>
<text x="118.93" y="176" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#404040" font-weight="700" text-anchor="middle">7 · Publish</text>
<text x="118.93" y="196" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666666" text-anchor="middle">replace buffer + timestamp</text>
<text x="118.93" y="214" font-family="SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="11" fill="#666666" text-anchor="middle">application reads it</text>
<path d="M638.648 87 L638.648 145" fill="none" stroke="#1abc9c" stroke-width="1.6" marker-end="url(#aGreen)"/>
<path d="M532.719 189 L484.719 189" fill="none" stroke="#1abc9c" stroke-width="1.6" marker-end="url(#aGreen)"/>
<path d="M272.859 189 L224.859 189" fill="none" stroke="#1abc9c" stroke-width="1.6" marker-end="url(#aGreen)"/>
<rect x="153.984" y="256" width="709.469" height="50" rx="3" fill="#e7f2fa" stroke="#e7f2fa" stroke-width="1"/>
<path d="M155.984 260 V302" stroke="#6ab0de" stroke-width="4" stroke-linecap="round"/>
<text x="171.984" y="276" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040" font-weight="700">Failure is explicit</text>
<text x="171.984" y="294" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#404040">An incomplete render, a mismatched identity, invalid dimensions or a malformed payload is rejected before sensor state changes.</text>
</svg>

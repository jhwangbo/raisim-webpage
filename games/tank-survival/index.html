<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaiSim Tank Survival</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="RaiSim Tank Survival">
  <meta name="twitter:title" content="RaiSim Tank Survival">
  <meta name="description" content="Hold out against waves of armored vehicles in a tank battle that runs in your browser. Every shell, blast and wading tank is simulated by RaiSim and drawn by Rayrai.">
  <meta property="og:description" content="Hold out against waves of armored vehicles in a tank battle that runs in your browser. Every shell, blast and wading tank is simulated by RaiSim and drawn by Rayrai.">
  <meta name="twitter:description" content="Hold out against waves of armored vehicles in a tank battle that runs in your browser. Every shell, blast and wading tank is simulated by RaiSim and drawn by Rayrai.">
  <link rel="canonical" href="https://raisim.com/games/tank-survival/">
  <meta property="og:url" content="https://raisim.com/games/tank-survival/">
  <meta property="og:image" content="https://raisim.com/games/tank-survival/tank_survival_card.jpg">
  <meta name="twitter:image" content="https://raisim.com/games/tank-survival/tank_survival_card.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050507; color: #e8e8ea;
      font: 14px system-ui, sans-serif; }
    #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none;
      touch-action: none; user-select: none; }
    body[data-state="loading"] #canvas { visibility: hidden; }
    #status { position: fixed; left: 16px; bottom: 16px; margin: 0; max-width: calc(100% - 32px); }
    #progress { position: fixed; left: 50%; top: 50%; width: min(420px, 70vw); height: 8px; transform: translate(-50%, -50%);
      appearance: none; border: 0; border-radius: 4px; background: #24242a; overflow: hidden; }
    #progress::-webkit-progress-bar { background: #24242a; }
    #progress::-webkit-progress-value { background: #d6ba60; transition: width .2s; }
    #progress::-moz-progress-bar { background: #d6ba60; }
    body:not([data-state="loading"]) #progress { display: none; }
    #status:empty { display: none; }
    body[data-state="error"] #status { color: #ff8a80; }
    #raisim-notice { position: fixed; right: 12px; bottom: 8px; margin: 0; padding: 3px 8px; border-radius: 6px;
      background: rgba(5, 5, 7, 0.55); color: rgba(232, 232, 234, 0.8); font-size: 12px; }
    #raisim-notice a { color: inherit; }
  </style>
  <script type="module">
    import {startRayraiPage} from './rayrai-app.mjs';
    startRayraiPage(new URL('./tank_survival.mjs', import.meta.url), {assets: new URL('./tank_survival.assets.json', import.meta.url)});
  </script>
</head>
<body data-state="loading">
  <canvas id="canvas" tabindex="0" aria-label="RaiSim Tank Survival"></canvas>
  <progress id="progress" max="1" value="0" aria-label="Loading"></progress>
  <p id="status" role="status">Loading…</p>
  <footer id="raisim-notice">Built with RaiSim and Rayrai, subject to the
    <a href="./raisim-license.txt" target="_blank" rel="noopener">RaiSim WebAssembly license</a> ·
    <a href="./raisim-third-party-notices.txt" target="_blank" rel="noopener">Third-party notices</a></footer>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">RaiSim speedup over MuJoCo</title>
  <desc id="desc">Horizontal bar chart showing MuJoCo median time divided by RaiSim median time for six benchmarks, based on three single-threaded runs. Higher values mean RaiSim is faster.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24313d; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #607080; }
    .axis { stroke: #a8b4bf; stroke-width: 1; }
    .grid { stroke: #d8dee5; stroke-width: 1; }
    .label { font-size: 14px; font-weight: 600; }
    .tick { font-size: 12px; fill: #607080; }
    .value { font-size: 13px; font-weight: 700; fill: #24313d; }
    .bar { fill: #2f6fb7; }
  </style>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="36" class="title">RaiSim speedup over MuJoCo</text>
  <text x="30" y="60" class="subtitle">MuJoCo median / RaiSim median across three single-threaded runs. Higher is better.</text>
  <line x1="230" y1="82" x2="230" y2="390" class="grid"/>
  <line x1="382" y1="82" x2="382" y2="390" class="grid"/>
  <line x1="535" y1="82" x2="535" y2="390" class="grid"/>
  <line x1="687" y1="82" x2="687" y2="390" class="grid"/>
  <line x1="839" y1="82" x2="839" y2="390" class="grid"/>
  <line x1="230" y1="390" x2="900" y2="390" class="axis"/>
  <text x="230" y="412" text-anchor="middle" class="tick">0x</text>
  <text x="382" y="412" text-anchor="middle" class="tick">1.5x</text>
  <text x="535" y="412" text-anchor="middle" class="tick">3.0x</text>
  <text x="687" y="412" text-anchor="middle" class="tick">4.5x</text>
  <text x="839" y="412" text-anchor="middle" class="tick">6.0x</text>
  <text x="565" y="446" text-anchor="middle" class="subtitle">MuJoCo time / RaiSim time</text>
  <text x="30" y="112" class="label">Chain20 speed</text>
  <rect x="230" y="94" width="632" height="24" rx="4" class="bar"/>
  <text x="874" y="111" class="value">6.23x</text>
  <text x="30" y="162" class="label">Heightmap ANYmal speed</text>
  <rect x="230" y="144" width="482" height="24" rx="4" class="bar"/>
  <text x="724" y="161" class="value">4.75x</text>
  <text x="30" y="212" class="label">Primitive speed</text>
  <rect x="230" y="194" width="406" height="24" rx="4" class="bar"/>
  <text x="648" y="211" class="value">4.00x</text>
  <text x="30" y="262" class="label">Chain10 speed</text>
  <rect x="230" y="244" width="351" height="24" rx="4" class="bar"/>
  <text x="593" y="261" class="value">3.46x</text>
  <text x="30" y="312" class="label">ANYmal standing</text>
  <rect x="230" y="294" width="316" height="24" rx="4" class="bar"/>
  <text x="558" y="311" class="value">3.11x</text>
  <text x="30" y="362" class="label">ANYmal falling</text>
  <rect x="230" y="344" width="263" height="24" rx="4" class="bar"/>
  <text x="505" y="361" class="value">2.59x</text>
</svg>

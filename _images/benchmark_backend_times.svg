<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">RaiSim and MuJoCo benchmark timing comparison</title>
  <desc id="desc">Horizontal bar chart comparing RaiSim and MuJoCo wall-clock seconds for six benchmarks. Lower times are better.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24313d; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #607080; }
    .axis { stroke: #a8b4bf; stroke-width: 1; }
    .grid { stroke: #d8dee5; stroke-width: 1; }
    .label { font-size: 14px; font-weight: 600; }
    .tick { font-size: 12px; fill: #607080; }
    .value { font-size: 12px; fill: #24313d; }
    .legend { font-size: 13px; fill: #405060; }
    .raisim { fill: #14806f; }
    .mujoco { fill: #d47b42; }
  </style>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" class="title">Wall-clock time by backend</text>
  <text x="30" y="60" class="subtitle">Single thread, Apple M1, default benchmark arguments. Lower is better.</text>
  <rect x="650" y="32" width="14" height="14" rx="2" class="raisim"/>
  <text x="672" y="44" class="legend">RaiSim</text>
  <rect x="744" y="32" width="14" height="14" rx="2" class="mujoco"/>
  <text x="766" y="44" class="legend">MuJoCo</text>
  <line x1="230" y1="78" x2="230" y2="430" class="grid"/>
  <line x1="395" y1="78" x2="395" y2="430" class="grid"/>
  <line x1="560" y1="78" x2="560" y2="430" class="grid"/>
  <line x1="725" y1="78" x2="725" y2="430" class="grid"/>
  <line x1="890" y1="78" x2="890" y2="430" class="grid"/>
  <line x1="230" y1="430" x2="890" y2="430" class="axis"/>
  <text x="230" y="452" text-anchor="middle" class="tick">0</text>
  <text x="395" y="452" text-anchor="middle" class="tick">3</text>
  <text x="560" y="452" text-anchor="middle" class="tick">6</text>
  <text x="725" y="452" text-anchor="middle" class="tick">9</text>
  <text x="890" y="452" text-anchor="middle" class="tick">12 s</text>
  <text x="560" y="486" text-anchor="middle" class="subtitle">Wall-clock seconds</text>
  <text x="30" y="98" class="label">Chain20 speed</text>
  <rect x="230" y="82" width="24" height="16" rx="3" class="raisim"/>
  <rect x="230" y="103" width="149" height="16" rx="3" class="mujoco"/>
  <text x="262" y="95" class="value">0.434 s</text>
  <text x="387" y="116" class="value">2.708 s</text>
  <text x="30" y="158" class="label">Heightmap ANYmal speed</text>
  <rect x="230" y="142" width="57" height="16" rx="3" class="raisim"/>
  <rect x="230" y="163" width="240" height="16" rx="3" class="mujoco"/>
  <text x="295" y="155" class="value">1.035 s</text>
  <text x="478" y="176" class="value">4.371 s</text>
  <text x="30" y="218" class="label">Primitive speed</text>
  <rect x="230" y="202" width="167" height="16" rx="3" class="raisim"/>
  <rect x="230" y="223" width="587" height="16" rx="3" class="mujoco"/>
  <text x="405" y="215" class="value">3.037 s</text>
  <text x="825" y="236" class="value">10.678 s</text>
  <text x="30" y="278" class="label">Chain10 speed</text>
  <rect x="230" y="262" width="12" height="16" rx="3" class="raisim"/>
  <rect x="230" y="283" width="41" height="16" rx="3" class="mujoco"/>
  <text x="250" y="275" class="value">0.214 s</text>
  <text x="279" y="296" class="value">0.751 s</text>
  <text x="30" y="338" class="label">ANYmal standing</text>
  <rect x="230" y="322" width="212" height="16" rx="3" class="raisim"/>
  <rect x="230" y="343" width="637" height="16" rx="3" class="mujoco"/>
  <text x="450" y="335" class="value">3.855 s</text>
  <text x="875" y="356" class="value">11.580 s</text>
  <text x="30" y="398" class="label">ANYmal falling</text>
  <rect x="230" y="382" width="10" height="16" rx="3" class="raisim"/>
  <rect x="230" y="403" width="26" height="16" rx="3" class="mujoco"/>
  <text x="248" y="395" class="value">0.189 s</text>
  <text x="264" y="416" class="value">0.464 s</text>
</svg>

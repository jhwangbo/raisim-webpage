<svg xmlns="http://www.w3.org/2000/svg" width="696.484" height="273" viewBox="0 0 696.484 273" role="img" aria-labelledby="t d">
<title id="t">RaiSim TCP viewer data flow</title>
<desc id="d">One TCP session carries scene updates, control requests and sensor pixels between RaisimServer and the rayrai TCP viewer. UDP beacons only provide optional discovery.</desc>
<defs><marker id="aAccent" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2980b9"/></marker><marker id="aGreen" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1abc9c"/></marker><marker id="aMuted" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#666666"/></marker><marker id="aWarn" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#d9822b"/></marker></defs>
<rect width="696.484" height="273" fill="#fcfcfc"/>
<rect x="18" y="29.5" width="220.094" height="148" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/><path d="M19 31 H237.094" stroke="#1abc9c" stroke-width="3" stroke-linecap="round"/><text x="32" y="55.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#404040" font-weight="700">RaisimServer</text><text x="32" y="79.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="44" y="79.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Owns the World and its clock</text><text x="32" y="98.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="44" y="98.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Serializes scene and contacts</text><text x="32" y="117.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="44" y="117.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Applies pause, step, force, pose</text><text x="32" y="136.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="44" y="136.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Validates returned camera data</text><rect x="32" y="151.5" width="160.375" height="20" rx="3" fill="#f8f8f8" stroke="#e1e4e5" stroke-width="1"/><text x="40" y="165.5" font-family="SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e74c3c">binds 127.0.0.1:8080</text>
<rect x="438.875" y="20" width="239.609" height="167" rx="4" fill="#ffffff" stroke="#e1e4e5" stroke-width="1"/><path d="M439.875 21.5 H677.484" stroke="#2980b9" stroke-width="3" stroke-linecap="round"/><text x="452.875" y="46" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#404040" font-weight="700">rayrai TCP viewer</text><text x="452.875" y="70" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="464.875" y="70" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Renders the remote scene</text><text x="452.875" y="89" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="464.875" y="89" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Connection / Object / Render tabs</text><text x="452.875" y="108" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="464.875" y="108" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Records and replays sessions</text><text x="452.875" y="127" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="464.875" y="127" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Renders RGB/depth cameras</text><text x="452.875" y="146" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666666">•</text><text x="464.875" y="146" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#404040">Drives pause, step, force, pose</text><rect x="452.875" y="161" width="138.719" height="20" rx="3" fill="#f8f8f8" stroke="#e1e4e5" stroke-width="1"/><text x="460.875" y="175" font-family="SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e74c3c">rayrai_tcp_viewer</text>
<path d="M244.094 83.5 L432.875 83.5" fill="none" stroke="#2980b9" stroke-width="1.6" marker-end="url(#aAccent)"/>
<text x="338.484" y="75.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#2980b9" text-anchor="middle">scene updates · sensor requests</text>
<text x="338.484" y="107.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#666666" text-anchor="middle">one TCP session</text>
<path d="M432.875 123.5 L244.094 123.5" fill="none" stroke="#1abc9c" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="338.484" y="143.5" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1abc9c" text-anchor="middle">control requests · camera pixels</text>
<path d="M128.047 181.5 V223 H558.68 V195" fill="none" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#aWarn)"/>
<rect x="218.758" y="210" width="239.453" height="26" rx="3" fill="#ffedcc" stroke="#f0b37e" stroke-width="1"/>
<text x="338.484" y="228" font-family="Lato,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8a5b1b" text-anchor="middle">UDP 59312 discovery beacon — optional</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">RaiSim TCP viewer data flow</title>
  <desc id="desc">RaisimServer exchanges scene updates, controls, and manual camera measurements with the rayrai TCP viewer. UDP beacons provide optional discovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">RaiSimServer + rayrai TCP viewer</text>
  <text x="800" y="92" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="19">One TCP session; discovery remains optional</text>

  <g filter="url(#shadow)">
    <rect x="90" y="150" width="390" height="315" rx="24" fill="#111827" stroke="#475569" stroke-width="2"/>
    <rect x="605" y="130" width="490" height="355" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <rect x="1220" y="185" width="290" height="245" rx="24" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <circle cx="145" cy="205" r="24" fill="#34d399" opacity=".2"/>
  <path d="M132 206h26M145 193v26" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <text x="185" y="211" fill="#f8fafc" font-family="sans-serif" font-size="29" font-weight="700">RaisimServer</text>
  <text x="130" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Owns World and simulation time</text>
  <text x="130" y="305" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Serializes scene and contacts</text>
  <text x="130" y="345" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Applies pause / step / force / pose</text>
  <text x="130" y="385" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Validates returned camera buffers</text>
  <rect x="130" y="411" width="306" height="30" rx="15" fill="#064e3b"/>
  <text x="283" y="433" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="17">default bind 127.0.0.1:8080</text>

  <circle cx="667" cy="190" r="24" fill="#38bdf8" opacity=".2"/>
  <path d="M653 197l10-18 10 18M658 194h10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
  <text x="707" y="197" fill="#f8fafc" font-family="sans-serif" font-size="29" font-weight="700">rayrai TCP viewer</text>
  <text x="650" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Reconstructs and renders the remote scene</text>
  <text x="650" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Connection, Object, Render, Diagnostics UI</text>
  <text x="650" y="330" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Records/replays raw TCP sessions</text>
  <text x="650" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Renders requested manual RGB/depth cameras</text>
  <text x="650" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="20">• Shows previews, frustums, RTT, and assets</text>
  <rect x="650" y="438" width="399" height="30" rx="15" fill="#0c4a6e"/>
  <text x="850" y="460" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="17">build-examples/examples/rayrai_tcp_viewer</text>

  <circle cx="1275" cy="240" r="24" fill="#a78bfa" opacity=".2"/>
  <path d="M1265 247c0-12 20-12 20 0M1275 229a7 7 0 1 0 0 .1" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
  <text x="1315" y="247" fill="#f8fafc" font-family="sans-serif" font-size="29" font-weight="700">Operator</text>
  <text x="1260" y="302" fill="#cbd5e1" font-family="sans-serif" font-size="20">Select and inspect</text>
  <text x="1260" y="339" fill="#cbd5e1" font-family="sans-serif" font-size="20">Pause and step</text>
  <text x="1260" y="376" fill="#cbd5e1" font-family="sans-serif" font-size="20">Apply force or pose</text>

  <path d="M480 216 H605" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="542" y="194" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="16">scene + sensor requests</text>
  <path d="M605 302 H480" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="542" y="330" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="16">controls + camera pixels</text>
  <path d="M1095 268 H1220" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1220 351 H1095" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrowAmber)"/>

  <path d="M285 465 V530 H850 V485" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrowAmber)"/>
  <text x="558" y="565" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="18">UDP 59312 discovery beacon • no scene data • direct TCP connection still works</text>
</svg>

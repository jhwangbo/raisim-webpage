<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">Length and tension scaling in two independent tendon branches</title>
  <desc id="desc">Branch A has divisor one and tension T. Branch B has divisor two and tension T divided by two. The total scalar length is LA plus LB divided by two. For a locked total length their length changes have ratio minus two.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a74b00"/></marker>
  </defs>
  <rect width="1100" height="400" rx="16" fill="#f5f8fc"/>
  <g font-family="sans-serif" fill="#142a43">
    <text x="550" y="37" text-anchor="middle" font-size="24" font-weight="bold">One scalar transmission; two independent spatial branches</text>
    <text x="275" y="80" text-anchor="middle" font-size="20">Branch A · divisor 1</text>
    <text x="825" y="80" text-anchor="middle" font-size="20">Branch B · divisor 2</text>
    <path d="M 170 109 H 380 M 720 109 H 930" stroke="#56677c" stroke-width="12"/>
    <path d="M 275 115 V 258 M 825 115 V 258" stroke="#e19b1c" stroke-width="5"/>
    <circle cx="275" cy="116" r="6" fill="#142a43"/>
    <circle cx="825" cy="116" r="6" fill="#142a43"/>
    <rect x="238" y="258" width="74" height="47" rx="5" fill="#2179b9"/>
    <rect x="788" y="258" width="74" height="47" rx="5" fill="#2179b9"/>
    <path d="M 190 122 V 254 M 181 122 H 199 M 181 254 H 199 M 740 122 V 254 M 731 122 H 749 M 731 254 H 749" stroke="#56677c" stroke-width="2"/>
    <text x="174" y="192" text-anchor="end" font-size="22">L<tspan baseline-shift="sub" font-size="15">A</tspan></text>
    <text x="724" y="192" text-anchor="end" font-size="22">L<tspan baseline-shift="sub" font-size="15">B</tspan></text>
    <path d="M 337 262 V 164" stroke="#a74b00" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 887 262 V 213" stroke="#a74b00" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="354" y="207" font-size="21" fill="#a74b00">T</text>
    <text x="904" y="238" font-size="21" fill="#a74b00">T / 2</text>
    <text x="550" y="341" text-anchor="middle" font-size="24">L = L<tspan baseline-shift="sub" font-size="16">A</tspan><tspan baseline-shift="baseline"> + L</tspan><tspan baseline-shift="sub" font-size="16">B</tspan><tspan baseline-shift="baseline"> / 2</tspan></text>
    <text x="550" y="375" text-anchor="middle" font-size="18">At locked L: a +1 cm change in branch A requires a −2 cm change in branch B.</text>
  </g>
</svg>
